<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Explore Japan · Sakura Dining</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
:root{--ink:#080604;--paper:#F0E8D5;--gold:#B8973A;--gold2:#D4AE52;--ff-en:'Cormorant Garamond',serif;--ff-ui:'DM Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--paper);font-family:var(--ff-ui);height:100svh;overflow:hidden;display:flex;flex-direction:column}
button{font-family:inherit}
.nav-header,.filters,.explorer-grid,.scroll-dots{position:relative;z-index:1}

/* Sakura petals */
.petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-20px;width:10px;height:8px;background:radial-gradient(circle at 30% 30%,#ffd9e4,#f4a3bd);border-radius:100% 0 100% 0;opacity:.45;animation:fall linear infinite}
@keyframes fall{from{transform:translate3d(0,-5vh,0) rotate(0)}to{transform:translate3d(70px,108vh,0) rotate(400deg)}}

.back-btn{position:fixed;left:16px;top:max(env(safe-area-inset-top),14px);z-index:100;text-decoration:none;color:var(--paper);background:rgba(255,255,255,.08);padding:10px 16px;border-radius:30px;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);font-size:11px}

.nav-header{padding:max(env(safe-area-inset-top),16px) 20px 10px;text-align:center}
.nav-header h1{font-family:var(--ff-en);font-size:clamp(26px,6vw,38px);color:var(--gold2);letter-spacing:.08em;margin-top:34px}
.nav-header p{margin-top:4px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.6}
.progress{display:inline-block;margin-top:10px;padding:5px 12px;border:1px solid rgba(184,151,58,.4);border-radius:30px;font-size:10px;letter-spacing:.12em;color:var(--gold2)}

.filters{display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(184,151,58,.2)}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid rgba(184,151,58,.3);background:transparent;color:var(--paper);padding:8px 14px;border-radius:30px;font-size:11px;letter-spacing:.06em;cursor:pointer;min-height:36px}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent;font-weight:600}

.explorer-grid{flex:1;min-height:0;display:flex;align-items:center;gap:14px;padding:14px 16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 16px}
.explorer-grid::-webkit-scrollbar{display:none}

.landmark-card{flex:0 0 min(85vw,360px);height:100%;max-height:600px;background:#0f0c09;border:1px solid rgba(184,151,58,.25);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;scroll-snap-align:center;transform:scale(.94);opacity:.65;transition:transform .4s,opacity .4s,box-shadow .4s}
.landmark-card[hidden]{display:none}
.landmark-card.active{transform:scale(1);opacity:1;box-shadow:0 0 26px rgba(212,174,82,.22);border-color:rgba(212,174,82,.5)}

.model-wrap{flex:1;min-height:130px;position:relative;overflow:hidden;background:radial-gradient(circle at center,#1b160c 0%,#080604 100%)}
.model-wrap.skeleton::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(100deg,transparent 30%,rgba(212,174,82,.12) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.model-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:.45s}
.model-wrap.model-active .model-poster{opacity:0;pointer-events:none}

model-viewer{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:.4s;z-index:2;--poster-color:transparent}
.model-wrap.model-active model-viewer{opacity:1;pointer-events:auto}
model-viewer::part(default-progress-bar),model-viewer::part(default-ar-button){display:none}

.pinch-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(8,6,4,.8);border:1px solid rgba(184,151,58,.35);padding:7px 14px;border-radius:30px;font-size:9px;letter-spacing:.12em;color:var(--gold2);z-index:10;opacity:0;white-space:nowrap;pointer-events:none}
.model-wrap.model-active .pinch-hint{opacity:1;animation:fadeout 4s ease 2s forwards}
@keyframes fadeout{to{opacity:0}}

.ar-badge,.stamp{position:absolute;top:10px;padding:6px 12px;border-radius:30px;font-size:9px;background:rgba(8,6,4,.8);border:1px solid var(--gold);color:var(--gold2);z-index:8;transition:.4s}
.ar-badge{right:10px;opacity:0;transform:translateY(-8px)}
.ar-badge.visible{opacity:1;transform:none}
.stamp{left:10px;display:none;background:rgba(184,151,58,.9);color:#000;font-weight:600}
.stamp.on{display:block}

.ar-loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(8,6,4,.85);z-index:20}
.ar-loading.show{display:flex}
.loader-ring{width:42px;height:42px;border-radius:50%;border:2px solid rgba(184,151,58,.15);border-top-color:var(--gold2);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-bar-track{width:110px;height:3px;background:rgba(184,151,58,.18);border-radius:10px;overflow:hidden}
.loader-bar-fill{height:100%;width:0;background:var(--gold2)}
.loader-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase}

.landmark-info{padding:12px 14px 14px;background:#11100d}
.info-top{display:flex;align-items:flex-start;gap:6px}
.info-titles{flex:1;min-width:0}
.landmark-name{font-family:var(--ff-en);font-size:25px;line-height:1.1}
.landmark-jp{font-size:11px;color:var(--gold2);opacity:.85;margin-top:2px;letter-spacing:.1em}
.icon-btn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(184,151,58,.35);background:rgba(184,151,58,.1);color:var(--gold2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn.on{background:rgba(184,151,58,.3)}
.landmark-desc{font-size:12px;line-height:1.45;opacity:.8;margin:8px 0 6px}
.landmark-fact{display:none;font-size:11.5px;line-height:1.45;color:var(--gold2);border-left:2px solid var(--gold);padding-left:9px;margin-bottom:8px}
.landmark-fact.open{display:block}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(184,151,58,.3);padding:3px 8px;border-radius:20px}

.btn-row{display:flex;gap:8px}
.action-btn{border:none;border-radius:10px;padding:12px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;min-height:46px;cursor:pointer}
.view3d-btn{background:rgba(184,151,58,.14);color:var(--gold2);border:1px solid rgba(184,151,58,.35)}
.view3d-btn.is-active{background:rgba(184,151,58,.25)}
.ar-btn{flex:1;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}
.ar-btn.ready-pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(212,174,82,.35)}}

.scroll-dots{display:flex;justify-content:center;align-items:center;gap:2px;padding:4px 0 2px}
.dot{width:22px;height:22px;border:none;background:none;cursor:pointer;position:relative}
.dot::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(184,151,58,.3);transition:.3s}
.dot.active::before{background:var(--gold2);transform:scale(1.4)}
.counter{position:relative;z-index:1;text-align:center;font-size:10px;letter-spacing:.2em;opacity:.6}
.order-link{position:relative;z-index:1;display:block;text-align:center;color:var(--gold2);font-size:11px;letter-spacing:.08em;text-decoration:none;padding:6px 0 max(env(safe-area-inset-bottom),12px)}

.swipe-hint{position:fixed;right:18px;bottom:110px;z-index:50;font-size:10px;letter-spacing:.18em;color:var(--gold2);background:rgba(8,6,4,.85);border:1px solid rgba(184,151,58,.4);padding:7px 12px;border-radius:30px;animation:nudge 1.2s ease-in-out infinite;pointer-events:none;transition:opacity .4s}
.swipe-hint.gone{opacity:0}
@keyframes nudge{50%{transform:translateX(6px)}}

.arrow{display:none;position:fixed;top:50%;z-index:60;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:rgba(8,6,4,.85);color:var(--gold2);font-size:18px;cursor:pointer}
.arrow.prev{left:14px}.arrow.next{right:14px}
@media (hover:hover) and (min-width:700px){.arrow{display:block}.swipe-hint{display:none}}

.toast{position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),70px);transform:translateX(-50%) translateY(20px);max-width:88vw;background:rgba(8,6,4,.96);border:1px solid var(--gold);color:var(--paper);padding:12px 18px;border-radius:14px;font-size:12px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;transition:.35s;z-index:400}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.guide{position:fixed;inset:0;z-index:300;background:rgba(8,6,4,.88);display:none;align-items:center;justify-content:center;padding:20px}
.guide.show{display:flex}
.guide-box{max-width:340px;width:100%;background:#11100d;border:1px solid var(--gold);border-radius:18px;padding:22px;text-align:center}
.guide-box h2{font-family:var(--ff-en);font-size:26px;color:var(--gold2);margin-bottom:12px}
.guide-box ol{list-style:none;text-align:left;font-size:13px;line-height:1.5;margin-bottom:18px}
.guide-box li{padding:8px 0;border-bottom:1px solid rgba(184,151,58,.15)}
.guide-box .action-btn{width:100%}
.guide-cancel{background:none;border:none;color:var(--paper);opacity:.6;font-size:11px;margin-top:12px;cursor:pointer}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="petals" id="petals"></div>
<a href="FunZone.html" class="back-btn">← Back</a>

<div class="nav-header">
  <h1>Explore Japan</h1>
  <p>Augmented Reality Landmarks</p>
  <div class="progress" id="progress">✦ 0 / 6 collected</div>
</div>

<div class="filters" id="filters">
  <button class="chip on" data-f="all">All</button>
  <button class="chip" data-f="castle">Castles</button>
  <button class="chip" data-f="shrine">Shrines</button>
  <button class="chip" data-f="modern">Modern</button>
  <button class="chip" data-f="culture">Culture</button>
</div>

<div class="explorer-grid" id="grid"></div>
<div class="scroll-dots" id="dots"></div>
<div class="counter" id="counter">1 / 6</div>
<a class="order-link" href="index.html">🍣 Hungry? Order at Sakura Dining →</a>

<button class="arrow prev" id="prev" aria-label="Previous">‹</button>
<button class="arrow next" id="next" aria-label="Next">›</button>
<div class="swipe-hint" id="swipe">SWIPE →</div>
<div class="toast" id="toast"></div>

<div class="guide" id="guide">
  <div class="guide-box">
    <h2>Before you start</h2>
    <ol>
      <li>📱 Allow camera access when asked.</li>
      <li>🧭 Point at a flat floor and move your phone slowly.</li>
      <li>🤏 Pinch to resize, drag to move, then take a photo!</li>
    </ol>
    <button class="action-btn ar-btn" id="guideGo">Got it, open camera</button>
    <button class="guide-cancel" id="guideNo">Cancel</button>
  </div>
</div>

<script>
const landmarks=[
{name:'Tokyo Skytree',jp:'東京スカイツリー',city:'Tokyo',cat:'modern',tags:['Tower','Tokyo'],folder:'tokyoskytree',file:'tokyoskytree',hasUsdz:true,
 desc:'The tallest tower in Japan, rising 634 m above the Tokyo skyline.',fact:'Its height, 634, can be read as "mu-sa-shi", an old name for the Tokyo region.'},
{name:'Japanese Torii Gate',jp:'鳥居',city:'Japan',cat:'shrine',tags:['Shrine','Sacred'],folder:'Japanese Torii Gate',file:'Japanese Torii Gate',hasUsdz:true,
 desc:'The sacred gate that marks the entrance to a Shinto shrine.',fact:'Walking through a torii symbolically moves you from everyday life into sacred ground.'},
{name:'Japanese Castle',jp:'日本の城',city:'Japan',cat:'castle',tags:['Castle','Samurai'],folder:'japanesecastle',file:'japanesecastle',hasUsdz:true,
 desc:'A classic keep with white walls and tiered roofs, built to defend a feudal lord.',fact:'Thick white plaster walls helped protect castles from fire.'},
{name:'Nijo Castle',jp:'二条城',city:'Kyoto',cat:'castle',tags:['Castle','UNESCO'],folder:'Nijo Castle japan',file:'Nijo Castle japan',hasUsdz:false,
 desc:'Kyoto\'s shogun residence, completed in 1603 and a UNESCO World Heritage Site.',fact:'Its "nightingale floors" chirp when walked on, warning of intruders.'},
{name:'Pagoda',jp:'五重塔',city:'Japan',cat:'shrine',tags:['Temple','Buddhist'],folder:'pagoda',file:'pagoda',hasUsdz:true,
 desc:'A multi-storey tower from Buddhist temples, most often five levels tall.',fact:'The flexible, layered wooden structure helps pagodas survive earthquakes.'},
{name:'Kimono Dress',jp:'着物',city:'Japan',cat:'culture',tags:['Fashion','Tradition'],folder:'dress',file:'dress',hasUsdz:true,
 desc:'Japan\'s traditional garment, worn at festivals, weddings and tea ceremonies.',fact:'A kimono is always wrapped left over right. The reverse is only for the deceased.'}
];

const AR_LABEL='🪐 View in Real World';
const $=id=>document.getElementById(id);
const grid=$('grid'),dotsEl=$('dots'),toastEl=$('toast');
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}};
const store={
 get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let favs=store.get('sd_fav',[]),seen=store.get('sd_seen',[]),guideSeen=store.get('sd_guide',false);

let toastTimer;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),4500)}

/* Sakura petals */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
 for(let k=0;k<12;k++){
  const p=document.createElement('span');p.className='petal';
  const s=6+Math.random()*8;
  p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s*.8}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*14}s`;
  $('petals').appendChild(p);
 }
}

/* Build cards */
landmarks.forEach((l,i)=>{
 const base=`ExploreJapan/${l.folder}/${l.file}`;
 const glb=encodeURI(`${base}.glb`),usdz=encodeURI(`${base}.usdz`),png=encodeURI(`${base}.png`);
 const card=document.createElement('div');
 card.className='landmark-card';card.dataset.index=i;card.dataset.cat=l.cat;
 card.innerHTML=`
 <div class="model-wrap skeleton" id="wrap-${i}">
  <img class="model-poster" src="${png}" alt="${l.name}" onload="this.parentNode.classList.remove('skeleton')" onerror="this.style.display='none'">
  <model-viewer id="mv-${i}" src="${glb}" ${l.hasUsdz?`ios-src="${usdz}"`:''}
   ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
   loading="lazy" environment-image="neutral" shadow-intensity="1.2" shadow-softness="0.8" exposure="1.1"
   camera-controls auto-rotate auto-rotate-delay="1500" touch-action="pan-y"
   min-camera-orbit="auto auto 8%" max-camera-orbit="auto auto 900%" field-of-view="18deg"
   interpolation-decay="200" interaction-prompt="none" alt="${l.name} 3D model"></model-viewer>
  <div class="ar-loading" id="arload-${i}">
   <div class="loader-ring"></div>
   <div class="loader-bar-track"><div class="loader-bar-fill" id="bar-${i}"></div></div>
   <div class="loader-label" id="lbl-${i}">Loading model...</div>
  </div>
  <div class="stamp${seen.includes(l.file)?' on':''}" id="stamp-${i}">✓ Collected</div>
  <div class="ar-badge" id="badge-${i}">✦ AR Ready</div>
  <div class="pinch-hint">⟺ Pinch Zoom • Drag Rotate • Scale in AR</div>
 </div>
 <div class="landmark-info">
  <div class="info-top">
   <div class="info-titles">
    <div class="landmark-name">${l.name}</div>
    <div class="landmark-jp">${l.jp} · ${l.city}</div>
   </div>
   <button class="icon-btn${favs.includes(l.file)?' on':''}" id="fav-${i}" onclick="toggleFav(${i})" aria-label="Favorite">${favs.includes(l.file)?'♥':'♡'}</button>
   <button class="icon-btn" onclick="share(${i})" aria-label="Share">⤴</button>
   <button class="icon-btn" id="info-${i}" onclick="toggleFact(${i})" aria-label="Fun fact">ⓘ</button>
  </div>
  <div class="landmark-desc">${l.desc}</div>
  <div class="landmark-fact" id="fact-${i}">💡 ${l.fact}</div>
  <div class="tags">${l.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  <div class="btn-row">
   <button class="action-btn view3d-btn" id="v3dbtn-${i}" onclick="toggle3D(${i})">⬡ 3D</button>
   <button class="action-btn ar-btn" id="arbtn-${i}" onclick="launchAR(${i})">${AR_LABEL}</button>
  </div>
 </div>`;
 grid.appendChild(card);
});

/* Model state */
const state={};
function startLoad(i){
 const s=state[i];
 if(!s||s.ready||s.loading||s.failed)return;
 s.loading=true;s.mv.setAttribute('loading','eager');
}

requestAnimationFrame(()=>{
 landmarks.forEach((l,i)=>{
  const mv=$(`mv-${i}`),arload=$(`arload-${i}`),bar=$(`bar-${i}`),lbl=$(`lbl-${i}`);
  const badge=$(`badge-${i}`),arbtn=$(`arbtn-${i}`),v3dbtn=$(`v3dbtn-${i}`),wrap=$(`wrap-${i}`);
  state[i]={mv,arload,badge,arbtn,v3dbtn,wrap,ready:false,loading:false,failed:false,showing3D:false,pending3D:false,waitingAR:false};

  mv.addEventListener('progress',e=>{const p=Math.round(e.detail.totalProgress*100);bar.style.width=p+'%';lbl.textContent=`Loading ${p}%`});

  mv.addEventListener('load',()=>{
   const s=state[i];
   s.ready=true;s.loading=false;s.failed=false;
   arload.classList.remove('show');badge.classList.add('visible');
   if(s.pending3D){s.pending3D=false;activate3DView(i)}
   /* AR must start from a fresh tap, so ask for one */
   if(s.waitingAR){s.waitingAR=false;arbtn.innerHTML='✦ Tap to Launch AR';arbtn.classList.add('ready-pulse')}
  });

  mv.addEventListener('error',()=>{
   const s=state[i];
   s.failed=true;s.loading=false;s.waitingAR=false;s.pending3D=false;
   arload.classList.remove('show');
   arbtn.innerHTML='↻ Retry';
   toast('Could not load this model. Tap Retry to try again.');
  });

  mv.addEventListener('ar-status',e=>{
   if(e.detail.status==='failed')toast('Could not start AR. Allow camera access and use Safari (iPhone) or Chrome (Android).');
  });
 });

 /* Preload visible card + next */
 const io=new IntersectionObserver(es=>{
  es.forEach(en=>{if(en.isIntersecting){const i=+en.target.dataset.index;startLoad(i);startLoad(i+1)}});
 },{root:grid,threshold:.5});
 grid.querySelectorAll('.landmark-card').forEach(c=>io.observe(c));
 startLoad(0);startLoad(1);

 buildDots();updateActive();updateProgress();
});

function retry(i){
 const s=state[i];
 s.failed=false;s.loading=true;
 s.arbtn.innerHTML=AR_LABEL;
 const src=s.mv.getAttribute('src').split('?')[0];
 s.mv.setAttribute('loading','eager');
 s.mv.setAttribute('src',src+'?r='+Date.now());
}

/* 3D view */
function activate3DView(i){const s=state[i];s.showing3D=true;s.wrap.classList.add('model-active');s.v3dbtn.classList.add('is-active');s.v3dbtn.innerHTML='✕ 2D'}
function deactivate3DView(i){const s=state[i];s.showing3D=false;s.wrap.classList.remove('model-active');s.v3dbtn.classList.remove('is-active');s.v3dbtn.innerHTML='⬡ 3D'}
function toggle3D(i){
 const s=state[i];buzz();
 if(s.failed){retry(i);s.pending3D=true;s.arload.classList.add('show');return}
 if(s.showing3D){deactivate3DView(i);return}
 if(s.ready)activate3DView(i);
 else{s.pending3D=true;startLoad(i);s.arload.classList.add('show')}
}

/* AR */
let guideFor=null;
function launchAR(i){
 const s=state[i];buzz();
 if(s.failed){retry(i);s.waitingAR=true;s.arload.classList.add('show');return}
 if(!s.ready){s.waitingAR=true;startLoad(i);s.arload.classList.add('show');return}
 if(!s.mv.canActivateAR){
  toast('AR needs a phone. Open this page on iPhone (Safari) or Android (Chrome) over HTTPS, not an in-app browser.');
  return;
 }
 if(!guideSeen){guideFor=i;$('guide').classList.add('show');return}
 doAR(i);
}
function doAR(i){
 const s=state[i];
 s.arbtn.classList.remove('ready-pulse');s.arbtn.innerHTML=AR_LABEL;
 s.mv.activateAR();      /* called directly inside a tap = camera allowed */
 collect(i);
}
$('guideGo').onclick=()=>{
 guideSeen=true;store.set('sd_guide',true);
 $('guide').classList.remove('show');
 if(guideFor!=null){const i=guideFor;guideFor=null;doAR(i)}
};
$('guideNo').onclick=()=>{$('guide').classList.remove('show');guideFor=null};

/* Collect stamps */
function collect(i){
 const f=landmarks[i].file;
 if(!seen.includes(f)){
  seen.push(f);store.set('sd_seen',seen);
  $(`stamp-${i}`).classList.add('on');
  updateProgress();
  if(seen.length===landmarks.length)toast('🎉 You collected them all! Show this screen at Sakura Dining.');
 }
}
function updateProgress(){$('progress').textContent=`✦ ${seen.length} / ${landmarks.length} collected`}

/* Favorites, share, fun fact */
function toggleFav(i){
 const f=landmarks[i].file,b=$(`fav-${i}`);buzz();
 if(favs.includes(f)){favs=favs.filter(x=>x!==f);b.classList.remove('on');b.textContent='♡'}
 else{favs.push(f);b.classList.add('on');b.textContent='♥'}
 store.set('sd_fav',favs);
}
async function share(i){
 const l=landmarks[i];buzz();
 const data={title:`${l.name} · Explore Japan`,text:`Check out ${l.name} in AR at Sakura Dining!`,url:location.href};
 try{
  if(navigator.share)await navigator.share(data);
  else{await navigator.clipboard.writeText(location.href);toast('Link copied!')}
 }catch(e){}
}
function toggleFact(i){buzz();$(`fact-${i}`).classList.toggle('open');$(`info-${i}`).classList.toggle('on')}

/* Filters */
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
 buzz();
 document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
 const f=c.dataset.f;
 grid.querySelectorAll('.landmark-card').forEach(card=>card.hidden=!(f==='all'||card.dataset.cat===f));
 grid.scrollTo({left:0});
 buildDots();updateActive();
});

/* Dots, counter, active card, arrows */
const visible=()=>[...grid.querySelectorAll('.landmark-card')].filter(c=>!c.hidden);
function buildDots(){
 dotsEl.innerHTML='';
 visible().forEach(c=>{
  const d=document.createElement('button');
  d.className='dot';d.setAttribute('aria-label','Go to card');
  d.onclick=()=>c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  dotsEl.appendChild(d);
 });
}
function activeIndex(){
 const vis=visible(),center=grid.scrollLeft+grid.clientWidth/2;
 let best=0,min=Infinity;
 vis.forEach((c,k)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-center);if(d<min){min=d;best=k}});
 return best;
}
function updateActive(){
 const vis=visible(),best=activeIndex();
 vis.forEach((c,k)=>c.classList.toggle('active',k===best));
 [...dotsEl.children].forEach((d,k)=>d.classList.toggle('active',k===best));
 $('counter').textContent=`${vis.length?best+1:0} / ${vis.length}`;
}
grid.style.position='relative';
let hinted=false;
grid.addEventListener('scroll',()=>{
 updateActive();
 if(!hinted){hinted=true;$('swipe').classList.add('gone')}
},{passive:true});
window.addEventListener('resize',updateActive);

function step(d){
 const vis=visible(),k=Math.max(0,Math.min(vis.length-1,activeIndex()+d));
 if(vis[k])vis[k].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
$('prev').onclick=()=>step(-1);
$('next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')step(1);
 if(e.key==='ArrowLeft')step(-1);
});
  /* ───────────── DISABLE RIGHT CLICK & DEVTOOLS SHORTCUTS ───────────── */
document.addEventListener("contextmenu", e => {
  e.preventDefault();
  showToast('Action Disabled');
});

document.addEventListener("keydown", e => {
  const isCmdOrCtrl = e.ctrlKey || e.metaKey;
  const key = e.key ? e.key.toUpperCase() : '';

  if (
    e.key === "F12" ||
    (isCmdOrCtrl && e.shiftKey && (key === "I" || key === "J" || key === "C")) ||
    (isCmdOrCtrl && key === "U")
  ) {
    e.preventDefault();
    showToast('Action Disabled');
  }
});
</script>
</body>
</html>
